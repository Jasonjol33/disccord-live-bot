# fly.toml app configuration file generated for disccord-live-bot on 2026-07-28T17:37:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'disccord-live-bot'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
